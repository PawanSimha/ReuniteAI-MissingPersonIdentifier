# CI — Continuous Integration
# ============================================================
# Runs on every push/PR to main (and manually via workflow_dispatch):
#   1. Provisions a fresh MongoDB 7 service container.
#   2. Installs Python 3.11 deps (dlib compiled from source with
#      --no-build-isolation + apt CMake to avoid pip cmake policy failures).
#   3. Runs the unittest suite.
#   4. Validates docker-compose.yml.
# No secrets required — all config is supplied via workflow env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key
      MONGO_URI: mongodb://127.0.0.1:27017/
      DB_NAME: reuniteai_db
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-admin-pass
      FLASK_DEBUG: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dlib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev libboost-python-dev libopenblas-dev libjpeg-dev zlib1g-dev libpng-dev

      # setuptools<82 pin: face_recognition_models imports pkg_resources,
      # which setuptools removed in v82. Upgrading to the latest setuptools
      # would break `import face_recognition` at test time.
      - name: Prepare build tooling (no-build-isolation needs setuptools/wheel)
        run: python -m pip install --upgrade "setuptools<82" wheel

      - name: Install Python dependencies
        run: pip install --no-build-isolation --retries 10 --timeout 120 -r requirements.txt

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if python -c "from pymongo import MongoClient; MongoClient('mongodb://127.0.0.1:27017/', serverSelectionTimeoutMS=1000).admin.command('ping')"; then
              echo "MongoDB is ready";
              exit 0;
            fi
            sleep 2;
          done
          echo "MongoDB did not become ready in time" && exit 1

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Validate docker-compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
